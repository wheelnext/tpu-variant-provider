[tox]
envlist = py310, py311, py312, py313, py314, py315, format, typecheck
isolated_build = True

[testenv]
deps =
    pytest
commands =
    pytest {posargs:tests}

[testenv:format]
deps =
    black
commands =
    black src/ tests/

[testenv:typecheck]
deps =
    pyrefly
commands =
    pyrefly check src/
