[tox]
envlist = py311, py312, py313, py314, py315, format, typecheck, lint
isolated_build = True

[testenv]
deps =
    pytest
commands =
    pytest {posargs:tests}

[testenv:format]
deps =
    black
commands =
    black src/ tests/

[testenv:typecheck]
deps =
    pyrefly
commands =
    pyrefly check src/

[testenv:lint]
deps =
    ruff
commands =
    ruff check src/ tests/
