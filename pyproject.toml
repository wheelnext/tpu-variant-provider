[build-system]
requires = [ "flit_core >=3.11" ]
build-backend = "flit_core.buildapi"

[project]
name = "tpu-variant-provider"
dynamic = ["description"]
dependencies = []
requires-python = ">=3.11"
authors = [
    { name = "Paul Ganssle", email = "pganssle@google.com" },
]
readme = "README.md"
version = "0.1.0"
license = { file = "LICENSE" }

[project.entry-points.variant_plugins]
tpu_variant_provider = "tpu_variant_provider.plugin:TpuVariantPlugin"

[tool.pytest.ini_options]
testpaths = ["tests/"]
xfail_strict = true

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [
    ".git",
    ".tox",
    ".venv",
    "build",
    "dist",
    "references",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "PL",   # pylint
    "D",    # pydocstyle (docstring checks)
]
ignore = [
    "D100", # Missing docstring in public module
    "D104", # Missing docstring in public package
    "D101", # Missing docstring in public class
    "D102", # Missing docstring in public method
    "D103", # Missing docstring in public function
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["tpu_variant_provider"]
